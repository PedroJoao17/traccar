services:
  traccar:
    image: traccar/traccar:latest
    container_name: traccar
    restart: unless-stopped
    ports:
      - "8082:8082"
      - "5055:5055"
    volumes:
      - ./traccar/data:/opt/traccar/data
      - ./traccar/logs:/opt/traccar/logs
    networks:
      - traccarnet

  proxy-server:
    build: ./node
    container_name: proxy-server
    restart: unless-stopped
    ports:
      - "8083:3000"
    networks:
      - traccarnet

networks:
  traccarnet:
    driver: bridge